plugins {
    id "com.android.application"
}

android {
    namespace "dev.vitorsilverio.gbcemu.android"
    compileSdk 35

    defaultConfig {
        applicationId "dev.vitorsilverio.gbcemu.android"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-dev"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += ["../src/main/java"]
            java.exclude(
                    "dev/vitorsilverio/gbcemu/Main.java",
                    "dev/vitorsilverio/gbcemu/gui/**",
                    "dev/vitorsilverio/gbcemu/multiplayer/Multiplayer.java"
            )
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "gbcemu.apk"
        }
    }
}

dependencies {
    implementation "org.slf4j:slf4j-api:2.0.17"
}
